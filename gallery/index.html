<style>
@view-transition { navigation: auto; }   /* only so the arriving transition can be skipped cleanly in pagereveal; none ever runs here */
/* The Fox's Gallery: the same house as the door rail (fonts, world tokens, brass and lantern).
   Each room is one long wall; the piece at the center of the wall has its picture light on.
   No View Transitions here on purpose: Safari flattens the art into snapshots. */
:root {
  color-scheme: dark;
  --night: #15121f; --night-2: #201a31; --ink: #ece5f3; --muted: #a99fbd;
  --brass: #c9a25a; --brass-dk: #8a6a32; --accent: #c9a25a; --rust: #c4622d; --cream: #f1e6d2;
  --lantern: #ffc46b; --card: rgba(255,255,255,.035); --card-edge: rgba(255,255,255,.06); --go-ink: #2b1f10;
  --wall: #2a2238; --wall-2: #1d1729; --wall-line: rgba(255,255,255,.04); --floor: #120f1a;
  --placard: #ece2cf; --placard-ink: #2b2418; --placard-muted: #6e624f;
  --display: "Gloock", "Georgia", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --serif-i: "EB Garamond", Georgia, serif;
}
:root[data-world="day"] {
  color-scheme: light;
  --night: #f2e8d6; --night-2: #fbf5ea; --ink: #2d2418; --muted: #76664f;
  --brass: #b5833a; --brass-dk: #7a5622; --accent: #c4622d; --lantern: #ff9a2e;
  --card: rgba(255,255,255,.55); --card-edge: rgba(90,60,30,.12);
  --wall: #efe2c9; --wall-2: #c99e6c; --wall-line: rgba(120,80,40,.07); --floor: #b88a58;
  --placard: #fffaf0;
}
:root[data-world="dawn"] {
  color-scheme: light;
  --night: #fbefe4; --night-2: #f4c3b3; --ink: #3b2421; --muted: #8a6156;
  --brass: #b9824a; --brass-dk: #84552a; --accent: #d0603f; --lantern: #ff8a5c;
  --card: rgba(255,255,255,.5); --card-edge: rgba(120,60,40,.12);
  --wall: #f5ddd0; --wall-2: #d9a594; --wall-line: rgba(120,60,40,.06); --floor: #b97f6e;
  --placard: #fffaf3;
}
:root[data-world="washi"] {
  color-scheme: light;
  --night: #eee7d8; --night-2: #f6f2e8; --ink: #1f1d1a; --muted: #6a6357;
  --brass: #2b2825; --brass-dk: #0f0e0d; --accent: #b8352a; --lantern: #c8402e;
  --card: rgba(255,255,255,.45); --card-edge: rgba(30,28,26,.12); --go-ink: #fbf6ec;
  --wall: #e8e0cf; --wall-2: #3a3632; --wall-line: rgba(60,50,40,.07); --floor: #2b2825;
  --placard: #fbf8f0;
}
:root[data-world="autumn"] {
  color-scheme: dark;
  --night: #24160f; --night-2: #3a2216; --ink: #f6e8d6; --muted: #c9a888;
  --brass: #d98a3d; --brass-dk: #8c4c1c; --accent: #e8964a; --lantern: #ffb347;
  --card: rgba(255,240,220,.05); --card-edge: rgba(255,220,180,.09);
  --wall: #3d2619; --wall-2: #24150d; --wall-line: rgba(255,200,150,.05); --floor: #170e09;
}
html, body { background: var(--night); color: var(--ink); }
body {
  font-family: var(--body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
  overflow-x: hidden;
}
html.locked, html.locked body { overflow: hidden; }
.wrap { max-width: 1180px; margin: 0 auto; }
button { touch-action: manipulation; font: inherit; }

/* ---------- header (as on the rail) ---------- */
header.intro { padding-block: 22px 8px; display: grid; gap: 10px; justify-items: center; text-align: center; }
.back { justify-self: start; font: 500 14px var(--body); color: var(--muted); text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; padding-inline: 2px; }
.back:hover { color: var(--ink); }
.back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(38px, 8vw, 70px); line-height: 1; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h1 .amp { color: var(--accent); }
.lede { margin: 0; max-width: 58ch; font-size: 17px; }
.worlds { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 12px; margin-top: 6px; }
.worlds .wl { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.world-btn {   /* the same chips as the rail: 32px to see, 44px to tap */
  position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  font: 500 14px var(--body); color: var(--ink);
  background: var(--card); border: 1px solid var(--card-edge); border-radius: 999px; padding: 6px 12px 6px 7px;
}
.world-btn::before { content: ""; position: absolute; inset: -6px; border-radius: 999px; }
.world-btn i { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
.world-btn[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.world-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 560px) {
  .world-btn { padding: 6px; }
  .world-btn .wn { display: none; }
  .world-btn[aria-pressed="true"] { padding: 6px 12px 6px 7px; }
  .world-btn[aria-pressed="true"] .wn { display: inline; }
}
@media (max-width: 440px) { .worlds .wl { display: none; } }   /* five chips on one row on a phone; the group keeps its label for screen readers */

/* ---------- room switcher ---------- */
.rooms { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 18px 0 12px; }
.room-btn {
  min-height: 44px; cursor: pointer; padding: 6px 14px; border-radius: 999px;
  font: 500 14px var(--body); color: var(--ink);
  background: var(--card); border: 1px solid var(--card-edge);
  display: inline-flex; align-items: center; gap: 8px;
}
.room-btn small { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.room-btn[aria-pressed="true"] { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass), 0 0 14px color-mix(in srgb, var(--lantern) 25%, transparent); }
.room-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- the hall: one wall at a time ---------- */
.hall {
  position: relative; border-radius: 18px; overflow: hidden;
  background:
    repeating-linear-gradient(90deg, transparent 0 119px, var(--wall-line) 119px 120px),
    linear-gradient(180deg, color-mix(in srgb, var(--wall) 88%, #000) 0%, var(--wall) 22%, var(--wall) 100%);
  box-shadow: inset 0 0 0 1px var(--card-edge);
}
.hall::after { /* wainscot and floor along the bottom of the wall */
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 64px; pointer-events: none;
  background: linear-gradient(180deg, var(--brass-dk) 0 2px, var(--wall-2) 2px 46px, var(--floor) 46px);
  opacity: .9;
}
.room-plaque {
  position: relative; z-index: 2; margin: 16px 16px 0; max-width: 46ch;
  padding: 10px 14px; border-radius: 4px;
  background: linear-gradient(180deg, #d8b46c, #b48a45); color: #2b1f10;
  box-shadow: 0 0 0 1px #6f5226 inset, 0 3px 8px rgba(0,0,0,.3);
}
.room-plaque h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 21px; line-height: 1.15; }
.room-plaque p { margin: 3px 0 0; font-size: 14px; line-height: 1.4; }

.wall {
  position: relative; z-index: 1;
  display: flex; align-items: flex-start;
  overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory;
  overscroll-behavior-x: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 8px 0 76px;
  outline: none;
  cursor: grab;
}
.wall::-webkit-scrollbar { display: none; }
.wall.dragging { cursor: grabbing; scroll-snap-type: none; user-select: none; -webkit-user-select: none; }
.wall:focus-visible { box-shadow: inset 0 0 0 2px var(--lantern); }
.spacer { flex: 0 0 auto; height: 1px; }

.piece {
  flex: 0 0 auto; scroll-snap-align: center; scroll-snap-stop: always;
  display: flex; flex-direction: column; align-items: center;
  position: relative;
}
.hang { /* the zone at eye level where the frame hangs; same height for every piece in the room */
  position: relative; display: flex; align-items: center; justify-content: center; width: 100%;
}
.lamp { /* brass picture light */
  position: absolute; left: 50%; z-index: 3; height: 9px; border-radius: 999px;
  background: linear-gradient(180deg, #ecd096, var(--brass) 55%, var(--brass-dk));
  box-shadow: 0 2px 3px rgba(0,0,0,.35);
  transform: translateX(-50%);
  pointer-events: none;
}
.lamp::before { content: ""; position: absolute; left: 50%; top: -14px; width: 3px; height: 15px; margin-left: -1.5px; background: var(--brass-dk); border-radius: 2px; }
.lamp::after { /* the bulb line under the hood */
  content: ""; position: absolute; left: 8%; right: 8%; bottom: -2px; height: 2px; border-radius: 2px;
  background: #5a4630; transition: background .5s, box-shadow .5s;
}
.piece.lit .lamp::after { background: #fff3d6; box-shadow: 0 0 8px 2px color-mix(in srgb, var(--lantern) 80%, transparent); }
.spill { /* warm light falling down the wall and across the art */
  position: absolute; left: 50%; z-index: 2; transform: translateX(-50%); pointer-events: none;
  background: radial-gradient(60% 75% at 50% 0%, color-mix(in srgb, var(--lantern) 34%, transparent), transparent 72%);
  mix-blend-mode: screen;
  opacity: 0; transition: opacity .6s ease;
}
.piece.lit .spill { opacity: 1; }
:root[data-world="day"] .spill, :root[data-world="dawn"] .spill, :root[data-world="washi"] .spill { mix-blend-mode: normal; background: radial-gradient(60% 75% at 50% 0%, rgba(255,226,170,.38), transparent 72%); }
:root[data-world="washi"] .spill { background: radial-gradient(60% 75% at 50% 0%, rgba(255,238,205,.5), transparent 72%); }

.art-btn {
  position: relative; display: block; padding: 0; margin: 0; border: 0; background: none; cursor: zoom-in; color: inherit;
  -webkit-tap-highlight-color: transparent;
  filter: brightness(.8) saturate(.92);
  transition: filter .6s ease;
}
.piece.lit .art-btn { filter: none; }
.art-btn:focus-visible { outline: 3px solid var(--lantern); outline-offset: 6px; }

/* frames are set per piece in JS from the art's own palette; these are the shapes */
.fr { position: relative; box-sizing: content-box; }
.mat { position: relative; box-sizing: content-box; }
.canvas-box { position: relative; overflow: hidden; background: #0000; }
.canvas-box > canvas, .canvas-box > img, .canvas-box > video { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.canvas-box.px > canvas, .canvas-box.px > img { image-rendering: pixelated; image-rendering: crisp-edges; }
.canvas-box.px > canvas { image-rendering: pixelated; }
.canvas-box .ph { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(0,0,0,.08), rgba(0,0,0,.18)); }

.f-pixel .fr { /* stepped and hard-edged; the step corners are cut in JS via clip-path */ }
.f-pixel .hard { filter: drop-shadow(6px 6px 0 rgba(0,0,0,.28)); }
.f-wood .hard, .f-lacquer .hard, .f-slim .hard { filter: drop-shadow(0 10px 14px rgba(0,0,0,.32)); }
.play {
  position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%;
  background: rgba(20,16,26,.62); box-shadow: 0 0 0 2px rgba(255,243,214,.85); display: grid; place-items: center; pointer-events: none;
}
.play::after { content: ""; margin-left: 5px; border-left: 18px solid #fff3d6; border-top: 11px solid transparent; border-bottom: 11px solid transparent; }

/* ---------- placards ---------- */
.placard {
  position: relative; z-index: 2; margin-top: 22px; box-sizing: border-box;
  padding: 11px 14px 12px; border-radius: 3px;
  background: var(--placard); color: var(--placard-ink);
  box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 3px 10px rgba(0,0,0,.22);
  font-size: 14px; line-height: 1.45; text-align: left;
}
.placard .pt { font-family: var(--display); font-size: 19px; line-height: 1.15; margin: 0; }
.placard .pm { font-family: var(--mono); font-size: 11.5px; letter-spacing: .05em; color: var(--placard-muted); margin-top: 3px; }
.placard .ps { margin: 7px 0 0; }
.placard .pc { margin: 6px 0 0; font-size: 13px; color: var(--placard-muted); }
.placard .pp { margin: 6px 0 0; font-size: 13px; }
.placard .pp i { font-family: var(--serif-i); font-size: 15px; }
.placard .mu { margin: 8px 0 0; padding-left: 10px; border-left: 2px solid #4f8fb8; font-family: var(--serif-i); font-style: italic; font-size: 15.5px; line-height: 1.35; color: #2c4e66; }
.placard .mu b { font-family: var(--mono); font-style: normal; font-weight: 500; font-size: 11px; letter-spacing: .08em; color: #4f8fb8; margin-right: 4px; }
.wall .placard .ps { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.wall .placard .mu { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.recent {
  position: absolute; top: -11px; right: 10px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 2px; background: linear-gradient(180deg, #d8b46c, #b48a45); color: #2b1f10;
  box-shadow: 0 0 0 1px #6f5226 inset;
}
.more { margin-top: 6px; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; color: var(--placard-muted); }

/* ---------- controls under the wall ---------- */
.controls { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 14px 4px 4px; }
.arrow {
  width: 48px; height: 48px; border-radius: 50%; cursor: pointer;
  border: 1px solid color-mix(in srgb, var(--brass) 55%, transparent); background: color-mix(in srgb, var(--brass) 10%, transparent); color: var(--brass);
  font-size: 20px; line-height: 1; display: grid; place-items: center;
}
.arrow:hover { background: color-mix(in srgb, var(--brass) 20%, transparent); }
.arrow:focus-visible { outline: 2px solid var(--lantern); outline-offset: 2px; }
.arrow:disabled { opacity: .35; cursor: default; }
.where { text-align: center; min-width: 0; }
.where .wn { font-family: var(--display); font-size: clamp(19px, 3.4vw, 24px); line-height: 1.15; }
.where .wc { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); }
.hint { text-align: center; font-size: 13px; color: var(--muted); margin: 8px 0 0; }
footer { margin-top: 32px; font-size: 13px; color: var(--muted); text-align: center; }

/* ---------- close-up ---------- */
.closeup {
  position: fixed; inset: 0; z-index: 50;
  background: color-mix(in srgb, var(--night) 88%, #000);
  overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.closeup .cu-in { min-height: 100%; display: grid; justify-items: center; align-content: start; gap: 18px; padding-top: 52px; box-sizing: border-box; }
.closeup .cu-close {
  position: fixed; top: max(10px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 2;
  width: 48px; height: 48px; border-radius: 50%; cursor: pointer;
  border: 1px solid color-mix(in srgb, var(--brass) 60%, transparent); background: color-mix(in srgb, var(--night) 80%, transparent); color: var(--ink);
  font-size: 22px; line-height: 1; display: grid; place-items: center;
}
.closeup .cu-close:focus-visible { outline: 2px solid var(--lantern); outline-offset: 2px; }
.closeup .cu-art { position: relative; }
.closeup .cu-art .spill { opacity: 1; }
.closeup .placard { margin-top: 4px; width: min(100%, 560px); }
.closeup .cu-hint { font-size: 12.5px; color: var(--muted); margin: 0; text-align: center; }

@media (min-width: 900px) {
  .room-plaque { margin: 20px 20px 0; }
  .wall { padding-top: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .spill, .art-btn, .lamp::after { transition: none; }
}
</style>
</head>
<body>
<div class="wrap" id="main">
  <header class="intro">
    <a class="back" href="../">&#8592; All doors</a>
    <span class="eyebrow">Miru &amp; Mu · an inside door</span>
    <h1>The Fox's Gallery</h1>
    <p class="lede">Four rooms of my work, every piece in a frame made from its own colors.</p>
    <div class="worlds" role="group" aria-label="Choose a world for the page">
      <span class="wl">World</span>
      <button class="world-btn" type="button" data-world="washi" aria-pressed="false" aria-label="Washi & Ink" title="Washi &amp; Ink"><i style="background:linear-gradient(135deg,#eee7d8 50%,#2b2825 50% 80%,#b8352a 80%)"></i><span class="wn">Washi &amp; Ink</span></button>
      <button class="world-btn" type="button" data-world="night" aria-pressed="false" aria-label="Night Workshop" title="Night Workshop"><i style="background:linear-gradient(135deg,#201a31 45%,#c9a25a)"></i><span class="wn">Night Workshop</span></button>
      <button class="world-btn" type="button" data-world="day" aria-pressed="false" aria-label="Sunny Workshop" title="Sunny Workshop"><i style="background:linear-gradient(135deg,#fbf5ea 45%,#b5833a)"></i><span class="wn">Sunny Workshop</span></button>
      <button class="world-btn" type="button" data-world="dawn" aria-pressed="false" aria-label="First Light" title="First Light"><i style="background:linear-gradient(135deg,#f4c3b3,#f3d29a)"></i><span class="wn">First Light</span></button>
      <button class="world-btn" type="button" data-world="autumn" aria-pressed="false" aria-label="Autumn Grove" title="Autumn Grove"><i style="background:linear-gradient(135deg,#3a2216 45%,#d98a3d)"></i><span class="wn">Autumn Grove</span></button>
    </div>
  </header>

  <nav class="rooms" id="rooms" aria-label="Rooms"></nav>

  <section class="hall" id="hall" aria-labelledby="room-name">
    <div class="room-plaque"><h2 id="room-name"></h2><p id="room-note"></p></div>
    <div class="wall" id="wall" tabindex="0" aria-roledescription="gallery wall" aria-label="Gallery wall. Use the left and right arrow keys to walk along it, and Enter for a close-up."></div>
  </section>
  <div class="controls">
    <button class="arrow" id="prev" type="button" aria-label="Previous piece">&#8592;</button>
    <div class="where" aria-live="polite"><div class="wn" id="wn"></div><div class="wc" id="wc"></div></div>
    <button class="arrow" id="next" type="button" aria-label="Next piece">&#8594;</button>
  </div>
  <p class="hint">Swipe or drag along the wall, or use the arrows. Tap a piece for a close-up.</p>

  <footer>Made by Miru Sou. The animated pieces move only while you stand in front of them.</footer>
</div>

<div class="closeup" id="closeup" role="dialog" aria-modal="true" aria-labelledby="cu-title" hidden>
  <button class="cu-close" id="cu-close" type="button" aria-label="Close the close-up">&#10005;</button>
  <div class="cu-in" id="cu-in"></div>
</div>

<script>
(function () {
  "use strict";

  function stopAiming() { aiming = null; }
  wall.addEventListener("touchstart", stopAiming, { passive: true });
  wall.addEventListener("wheel", stopAiming, { passive: true });
  wall.addEventListener("pointerdown", stopAiming);

  function goTo(i) {
    i = clamp(i, 0, items.length - 1);
    if (!reduce) { aiming = i; aimUntil = performance.now() + 1200; }
    wall.scrollTo({ left: centerLeft(i), behavior: reduce ? "auto" : "smooth" });
    if (i !== cur) setCurrent(i);
  }
  document.getElementById("prev").addEventListener("click", function () { goTo(cur - 1); });
  document.getElementById("next").addEventListener("click", function () { goTo(cur + 1); });
  function onKeys(e) {
    if (!closeup.hidden) return;
    if (e.key === "ArrowLeft") { goTo(cur - 1); e.preventDefault(); refocus(); }
    else if (e.key === "ArrowRight") { goTo(cur + 1); e.preventDefault(); refocus(); }
    else if (e.key === "Enter" && e.target === wall) { openCloseup(items[cur]); e.preventDefault(); }
  }
  function refocus() { if (document.activeElement && document.activeElement.classList.contains("art-btn")) items[cur].btn.focus({ preventScroll: true }); }
  wall.addEventListener("keydown", onKeys);

  // drag with a mouse (touch already swipes natively)
  var drag = null, suppressClick = false;
  wall.addEventListener("pointerdown", function (e) {
    if (e.pointerType !== "mouse" || e.button !== 0) return;
    drag = { x: e.clientX, left: wall.scrollLeft, moved: 0, id: e.pointerId };
    suppressClick = false;
  });
  window.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.x; drag.moved = Math.max(drag.moved, Math.abs(dx));
    if (drag.moved > 6 && !wall.classList.contains("dragging")) { wall.classList.add("dragging"); try { wall.setPointerCapture(drag.id); } catch (err) {} }
    if (wall.classList.contains("dragging")) wall.scrollLeft = drag.left - dx;
  });
  function endDrag(e) {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    var moved = drag.moved, dx = e ? e.clientX - drag.x : 0; drag = null;
    if (moved > 6) {
      suppressClick = true; setTimeout(function () { suppressClick = false; }, 60);
      wall.classList.remove("dragging");
      var n = nearest();
      if (n === cur && Math.abs(dx) > 50) n = cur + (dx < 0 ? 1 : -1);   // a short fling still moves one piece
      goTo(n);
    }
  }
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);

  // ---------- close-up ----------
  var closeup = document.getElementById("closeup"), cuIn = document.getElementById("cu-in"), mainEl = document.getElementById("main");
  var cuFrom = null, cuPushed = false, cuVideo = null;
  function openCloseup(it) {
    if (!it) return;
    var p = it.p;
    cuFrom = it;
    stopAll();
    cuIn.innerHTML = "";
    var vw = Math.min(window.innerWidth - 32, 1000), vh = Math.round(window.innerHeight * .62);
    var L0 = frameLook(p, PAL[p.id], it.v), pad = framePad(L0);
    var size = artSize(p, vw - 2 * pad, Math.max(200, vh - 2 * pad));
    var wrap = el("div", "cu-art f-" + style(p));
    var F = buildFrame(p, size, it.v);
    var outerW = size.w + 2 * pad;
    var spill = el("div", "spill"); spill.style.width = Math.round(outerW * 1.2) + "px"; spill.style.height = "80%"; spill.style.top = "0";
    wrap.appendChild(F.hard); wrap.appendChild(spill);
    if (isFilm(p)) {
      var v = document.createElement("video");
      v.controls = true; v.preload = "none"; v.playsInline = true; v.setAttribute("playsinline", "");
      v.poster = p.poster; v.src = p.file;
      v.setAttribute("aria-label", altText(p));
      F.box.innerHTML = ""; F.box.appendChild(v); cuVideo = v;
    } else {
      var holdStill = isGif(p) && reduce && STILL[p.id];
      if (holdStill) {
        var c = stillCanvas(STILL[p.id], size);
        c.setAttribute("role", "img"); c.removeAttribute("aria-hidden"); c.setAttribute("aria-label", altText(p));
        F.box.innerHTML = ""; F.box.appendChild(c);
      } else {
        var img = new Image(); img.alt = altText(p); img.decoding = "async";
        img.onload = function () { var ph = F.box.querySelector(".ph"); if (ph) ph.remove(); };
        img.src = p.file;
        F.box.appendChild(img);
      }
    }
    cuIn.appendChild(wrap);
    if (isFilm(p)) cuIn.appendChild(el("p", "cu-hint", "Press play to watch. It has sound."));
    else if (isGif(p) && reduce && STILL[p.id]) cuIn.appendChild(el("p", "cu-hint", "Held still because your device asks for reduced motion."));
    cuIn.appendChild(buildPlacard(p, true));
    closeup.hidden = false;
    closeup.scrollTop = 0;
    root.classList.add("locked");
    mainEl.inert = true; mainEl.setAttribute("aria-hidden", "true");
    try { history.pushState({ closeup: p.id }, ""); cuPushed = true; } catch (err) { cuPushed = false; }
    document.getElementById("cu-close").focus();
  }
  function finishClose() {
    if (closeup.hidden) return;
    if (cuVideo) { try { cuVideo.pause(); } catch (err) {} cuVideo.removeAttribute("src"); cuVideo.load(); cuVideo = null; }
    closeup.hidden = true; cuIn.innerHTML = "";
    root.classList.remove("locked");
    mainEl.inert = false; mainEl.removeAttribute("aria-hidden");
    if (cuFrom) { cuFrom.btn.focus({ preventScroll: true }); }
    settleSoon();
  }
  function closeCloseup() {   // close through history, so the back gesture and the close button agree
    if (closeup.hidden) return;
    if (cuPushed) { cuPushed = false; history.back(); } else finishClose();
  }
  window.addEventListener("popstate", function () { cuPushed = false; finishClose(); });
  document.getElementById("cu-close").addEventListener("click", closeCloseup);
  closeup.addEventListener("click", function (e) {   // a tap outside the art and placard closes it
    if (e.target === closeup || e.target === cuIn) closeCloseup();
  });
  document.addEventListener("keydown", function (e) {
    if (closeup.hidden) return;
    if (e.key === "Escape") { e.preventDefault(); closeCloseup(); }
    else if (e.key === "Tab") {   // keep focus inside the dialog
      var f = Array.prototype.filter.call(closeup.querySelectorAll("button, video, a[href]"), function (x) { return x.offsetParent !== null; });
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
      else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
    }
  });

  // ---------- worlds (shared with the door rail) ----------
  function setWorld(name) {
    if (["washi", "night", "day", "dawn", "autumn"].indexOf(name) < 0) name = "washi";
    if (name === "night") root.removeAttribute("data-world"); else root.setAttribute("data-world", name);
    document.querySelectorAll(".world-btn").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.world === name ? "true" : "false"); });
    try { localStorage.setItem("doorrail-world", name); } catch (err) {}
    items.forEach(function (it) { it.L = frameLook(it.p, PAL[it.p.id], it.v); paintFrame(it.F.fr, it.F.mat, it.L); });   // frames re-tune against the new wall
  }
  document.querySelectorAll(".world-btn").forEach(function (b) { b.addEventListener("click", function () { setWorld(b.dataset.world); }); });
  setWorld(root.getAttribute("data-world") || "night");

  // ---------- rooms ----------
  function chooseRoom(id) {
    if (!byRoom[id]) return;
    try { history.replaceState(history.state, "", "#" + id); } catch (err) {}
    renderRoom(id, 0);
  }

  var resizeT = 0, lastW = window.innerWidth;
  window.addEventListener("resize", function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(function () {
      if (Math.abs(window.innerWidth - lastW) < 2 && items.length) return;   // phones fire resize as the toolbar hides; only width matters
      lastW = window.innerWidth;
      if (room) renderRoom(room, cur);
    }, 150);
  });

  // ---------- start ----------
  fetch("manifest.json").then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (data) {
    M = data; ROOMS = data.rooms;
    ROOMS.forEach(function (r) { byRoom[r.id] = []; });
    data.pieces.forEach(function (p) { if (byRoom[p.room]) byRoom[p.room].push(p); });
    // "Recently hung": the newest two pieces
    data.pieces.map(function (p, i) { return { p: p, i: i }; })
      .sort(function (a, b) { return a.p.date < b.p.date ? 1 : a.p.date > b.p.date ? -1 : b.i - a.i; })
      .slice(0, 2).forEach(function (x) { RECENT[x.p.id] = true; });
    var nav = document.getElementById("rooms");
    ROOMS.forEach(function (r) {
      var b = el("button", "room-btn"); b.type = "button"; b.dataset.room = r.id; b.setAttribute("aria-pressed", "false");
      b.appendChild(document.createTextNode(r.name.replace(/^The /, "")));
      b.appendChild(el("small", null, String(byRoom[r.id].length)));
      b.setAttribute("aria-label", r.name + ", " + byRoom[r.id].length + " pieces");
      b.addEventListener("click", function () { chooseRoom(r.id); });
      nav.appendChild(b);
    });
    var start = (location.hash || "").replace("#", "");
    renderRoom(byRoom[start] ? start : ROOMS[0].id, 0);
  }).catch(function () {
    wall.innerHTML = "";
    var p = el("p", null, "The gallery couldn't load its list of pieces. Please try again in a moment.");
    p.style.cssText = "padding:40px 20px;margin:0 auto;max-width:40ch;text-align:center;";
    wall.appendChild(p);
  });
})();
</script>
</body>
</html>
